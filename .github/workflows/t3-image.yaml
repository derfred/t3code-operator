name: t3-image

# Builds images/t3 (t3 from the derfred/t3code fork) and checks it: its t3
# accepts the token in T3CODE_AUTH_TOKEN_FILE and refuses any other, and the
# operator's end-to-end test passes against it. Builds only; it pushes
# nothing. By hand, with another ref of the fork.

on:
  pull_request:
    paths:
      - "images/t3/**"
      - ".github/workflows/t3-image.yaml"
  workflow_dispatch:
    inputs:
      t3-ref:
        description: "Branch, tag or commit of derfred/t3code (default: the Dockerfile's)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: images/t3
          load: true
          tags: t3:ci
          build-args: |
            ${{ inputs.t3-ref && format('T3_REF={0}', inputs.t3-ref) || '' }}

      - name: Accepts the token file's token, and only that
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          openssl rand -hex 32 > "$dir/token"
          chmod 0755 "$dir"; chmod 0644 "$dir/token"
          docker run -d --name t3 -p 127.0.0.1:3773:3773 -v "$dir:/etc/t3code/api:ro" \
            -e T3CODE_AUTH_TOKEN_FILE=/etc/t3code/api/token t3:ci
          trap 'docker logs --tail 50 t3; docker rm -f t3 > /dev/null' EXIT
          for _ in $(seq 1 90); do
            curl -fs -o /dev/null http://127.0.0.1:3773/ && break
            sleep 2
          done
          status() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" http://127.0.0.1:3773/api/projects; }
          good=$(status "$(cat "$dir/token")"); bad=$(status "$(openssl rand -hex 32)")
          echo "the token file's token: $good; another: $bad"
          [ "$good" = 200 ] && [ "$bad" = 401 ]

      - name: Operator end-to-end, against this t3
        run: npm run e2e -- --t3-image t3:ci
