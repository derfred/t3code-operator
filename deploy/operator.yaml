# The operator, for the namespace its t3 pods run in (here `t3code`: change
# every `namespace:` to yours). Apply deploy/crds.yaml first.
#
# It expects one token per StatefulSet of t3 pods, each a token that set's
# pods accept (such as the one they read with `t3 serve --auth-token-file`),
# mounted as a file named after the StatefulSet: list one source per set in
# the `api-token` volume below. See README.md for what the t3 pods themselves
# need.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code-operator
  namespace: t3code
---
# Its own kinds, the StatefulSets they name, their pods, and the pods'
# content-ready condition. No Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: t3code-operator
  namespace: t3code
rules:
  - apiGroups: [t3code.derfred.com]
    resources: [t3projects, t3environmentsets]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [t3code.derfred.com]
    resources: [t3projects/status, t3environmentsets/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t3code-operator
  namespace: t3code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: t3code-operator
subjects:
  - kind: ServiceAccount
    name: t3code-operator
    namespace: t3code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3code-operator
  namespace: t3code
  labels:
    app: t3code-operator
spec:
  replicas: 1
  # Never two reconcilers at once, even during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: t3code-operator
  template:
    metadata:
      labels:
        app: t3code-operator
    spec:
      serviceAccountName: t3code-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/derfred/t3code-operator:0.1.0
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: T3CODE_API_TOKEN_DIR
              value: /etc/t3code/api
            # Optional: T3CODE_PORT (3773), RESYNC_INTERVAL_SECONDS (300),
            # CLONING_POLL_SECONDS (5).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: api-token
              mountPath: /etc/t3code/api
              readOnly: true
      volumes:
        # One file per StatefulSet, named after it. Here the token for the
        # pods of StatefulSet `t3code-example`, from Secret
        # `t3code-api-token-example`; add a source for each further set.
        - name: api-token
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: t3code-api-token-example
                  items:
                    - key: token
                      path: t3code-example
