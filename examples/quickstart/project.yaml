# What the operator puts on the t3 servers. quickstart.sh fills in
# ${REPOSITORY} (--repository; default: this repository). Edit the T3Project
# once it's running (kubectl -n t3code edit t3project quickstart) and watch
# t3 follow.
apiVersion: t3code.derfred.com/v1alpha1
kind: T3EnvironmentSet
metadata:
  name: quickstart
  namespace: t3code
  labels: { tier: quickstart }
spec:
  statefulSet: t3code-quickstart    # its pods are this set's environments
---
apiVersion: t3code.derfred.com/v1alpha1
kind: T3Project
metadata:
  name: quickstart
  namespace: t3code
spec:
  repository: ${REPOSITORY}
  environmentSetSelector:           # a LabelSelector over the sets' labels
    matchLabels: { tier: quickstart }
  project:                          # t3 project.update fields
    pinned: true
